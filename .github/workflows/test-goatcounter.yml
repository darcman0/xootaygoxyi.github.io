name: Tester GoatCounter

on:
  workflow_dispatch:

jobs:
  test-goatcounter:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les statistiques GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN_POPULAR_ARTICLE }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GOATCOUNTER_TOKEN}" \
            -H "Accept: application/json" \
            "https://darcman0.goatcounter.com/api/v0/stats/hits?limit=20&group=day&path_by_name=true" \
            -o goatcounter-hits.json

          echo "Réponse reçue de GoatCounter."
          echo "Clés principales de la réponse :"
          jq 'keys' goatcounter-hits.json

      - name: Conserver la réponse pour inspection
        uses: actions/upload-artifact@v4
        with:
          name: goatcounter-hits-test
          path: goatcounter-hits.json

name: Compilation et Déploiement du Site MkDocs

on:
  push:
    branches:
      - main
  schedule:
    # Exécution automatique le 1er et le 15 de chaque mois à 06:00 UTC
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Traitement et Publication
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # ÉTAPE 1 : Récupération des statistiques GoatCounter avec gestion de retentatives
      - name: Récupérer les statistiques GoatCounter
        env:
          GOATCOUNTER_API_TOKEN_POPULAR_ARTICLE: ${{ secrets.GOATCOUNTER_API_TOKEN_POPULAR_ARTICLE }}
        run: |
          for attempt in 1 2 3; do
            echo "Tentative ${attempt}/3 de récupération des statistiques…"
            if python scripts/update_popular_articles.py; then
              echo "Statistiques récupérées avec succès."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_minutes=$((attempt * 5))
              echo "GoatCounter momentanément indisponible. Nouvelle tentative dans ${wait_minutes} minute(s)."
              sleep "$((wait_minutes * 60))"
            fi
          done
          echo "::error::Impossible de récupérer les statistiques après 3 tentatives."
          exit 1

      # ÉTAPE 2 : Mise à jour du JSON sur le dépôt
      - name: Enregistrer le classement mis à jour dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/popular-articles.json
          git diff --cached --quiet || (git commit -m "chore: mise à jour automatique des articles populaires [skip ci]" && git push)

      # ÉTAPE 3 : Conservation du CNAME pour le domaine personnalisé
      - name: Préserver le domaine personnalisé (CNAME)
        run: |
          if [ -f CNAME ]; then
            cp CNAME docs/CNAME
          fi

      # ÉTAPE 4 : Génération et déploiement du site MkDocs
      - name: Générer et déployer le site MkDocs sur GitHub Pages
        run: mkdocs gh-deploy --force
name: Run MkDocs and Create HTML pages

on:
  push:
    branches:
      - main
  schedule:
    # Actualisation automatique chaque dimanche à 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # ÉTAPE 1 : Génération du fichier JSON des articles populaires
      - name: Update popular articles
        env:
          GOATCOUNTER_API_TOKEN_POPULAR_ARTICLE: ${{ secrets.GOATCOUNTER_API_TOKEN_POPULAR_ARTICLE }}
        run: python update_popular_articles.py

      # ÉTAPE 2 : Sauvegarde du JSON mis à jour sur la branche main
      - name: Commit updated popular articles JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/popular-articles.json
          git diff --staged --quiet || (git commit -m "chore: mise à jour automatique des articles populaires [skip ci]" && git push)

      - name: Preserve CNAME if present
        run: |
          if [ -f CNAME ]; then
            cp CNAME docs/CNAME
          fi

      # ÉTAPE 3 : Compilation et déploiement du site
      - name: Deploy
        run: mkdocs gh-deploy --force
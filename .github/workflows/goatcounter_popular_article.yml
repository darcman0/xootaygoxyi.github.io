name: Mettre à jour les articles populaires

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

concurrency:
  group: update-popular-articles
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-popular-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-requests-pyyaml

      - name: Installer les dépendances
        run: pip install requests==2.32.3 PyYAML==6.0.2

      - name: Récupérer les statistiques GoatCounter
        env:
          GOATCOUNTER_API_TOKEN_POPULAR_ARTICLE: ${{ secrets.GOATCOUNTER_API_TOKEN_POPULAR_ARTICLE }}
        run: |
          for attempt in 1 2 3; do
            echo "Tentative ${attempt}/3 de récupération des statistiques…"
            if python scripts/update_popular_articles.py; then
              echo "Statistiques récupérées avec succès."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_minutes=$((attempt * 5))
              echo "GoatCounter momentanément indisponible. Nouvelle tentative dans ${wait_minutes} minute(s)."
              sleep "$((wait_minutes * 60))"
            fi
          done
          echo "::error::Impossible de récupérer les statistiques après 3 tentatives."
          exit 1

      - name: Enregistrer le classement mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/popular-articles.json
          git diff --cached --quiet || git commit -m "chore: mettre à jour les articles populaires"
          git push